name: CI TourGuide

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  build-and-test:
    name: "[CI] Build & Tests Unitaires"
    runs-on: ubuntu-latest

    steps:
      - name: "TourGuide | Checkout code"
        uses: actions/checkout@v4

      - name: "TourGuide | Setup .NET 8"
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: "TourGuide | Restore dependencies"
        run: dotnet restore

      - name: "TourGuide | Build"
        run: dotnet build --no-restore --configuration Release -p:TreatWarningsAsErrors=false

      - name: "TourGuide | Tests Unitaires"
        run: dotnet test --no-build --configuration Release --filter "FullyQualifiedName!~PerformanceTest"

      - name: "TourGuide | Publish"
        run: dotnet publish ./Api/TourGuide.csproj --no-build --configuration Release --output ./publish

      - name: "TourGuide | Upload artifact"
        uses: actions/upload-artifact@v4
        with:
          name: tourguide-app
          path: ./publish

  performance-track-location:
    name: "[CI] TrackLocation - ${{ matrix.users }} users"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        users: [100, 1000, 5000, 10000, 50000, 100000]

    steps:
      - name: "TourGuide | Checkout code"
        uses: actions/checkout@v4

      - name: "TourGuide | Setup .NET 8"
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: "TourGuide | Restore dependencies"
        run: dotnet restore

      - name: "TourGuide | Build"
        run: dotnet build --no-restore --configuration Release -p:TreatWarningsAsErrors=false

      - name: "TourGuide | TrackLocation ${{ matrix.users }} users"
        run: dotnet test --no-build --configuration Release --filter "FullyQualifiedName~HighVolumeTrackLocation" --logger "console;verbosity=detailed"
        env:
          PERF_USER_COUNT: ${{ matrix.users }}

  performance-get-rewards:
    name: "[CI] GetRewards - ${{ matrix.users }} users"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        users: [100, 1000, 10000, 100000]

    steps:
      - name: "TourGuide | Checkout code"
        uses: actions/checkout@v4

      - name: "TourGuide | Setup .NET 8"
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: "TourGuide | Restore dependencies"
        run: dotnet restore

      - name: "TourGuide | Build"
        run: dotnet build --no-restore --configuration Release -p:TreatWarningsAsErrors=false

      - name: "TourGuide | GetRewards ${{ matrix.users }} users"
        run: dotnet test --no-build --configuration Release --filter "FullyQualifiedName~HighVolumeGetRewards" --logger "console;verbosity=detailed"
        env:
          PERF_USER_COUNT: ${{ matrix.users }}