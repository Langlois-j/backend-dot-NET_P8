name: CI TourGuide

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release -p:TreatWarningsAsErrors=false

      - name: Test
        run: dotnet test --no-build --configuration Release --filter "FullyQualifiedName!~PerformanceTest"

      - name: Publish
        run: dotnet publish ./Api/TourGuide.csproj --no-build --configuration Release --output ./publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tourguide-app
          path: ./publish